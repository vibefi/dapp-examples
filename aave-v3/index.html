<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aave V3 Mainnet – Minimal Console</title>
    <link rel="icon" type="image/webp" href="/assets/aave.webp" />
    <style>
      :root {
        --bg: #0b0c10;
        --card: #12141b;
        --muted: #8b93a7;
        --text: #e8ecf6;
        --border: rgba(255,255,255,.08);
        --accent: #b650f6;
        --good: #2ecc71;
        --warn: #f1c40f;
        --bad: #ff5c5c;
        --shadow: 0 8px 28px rgba(0,0,0,.35);
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      html, body { height: 100%; }
      body {
        margin: 0;
        background: radial-gradient(1200px 800px at 20% 10%, rgba(182,80,246,.18), transparent 55%),
                    radial-gradient(900px 650px at 80% 20%, rgba(0,180,255,.14), transparent 55%),
                    var(--bg);
        color: var(--text);
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, "Apple Color Emoji","Segoe UI Emoji";
      }
      a { color: inherit; }
      .container { max-width: 1100px; margin: 0 auto; padding: 24px; }
      .row { display: grid; gap: 16px; }
      .grid-2 { grid-template-columns: 1fr; }
      @media (min-width: 920px) { .grid-2 { grid-template-columns: 1fr 1fr; } }
      .card {
        background: linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.02));
        border: 1px solid var(--border);
        border-radius: 16px;
        box-shadow: var(--shadow);
        padding: 16px;
      }
      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 16px;
      }
      .brand { display: flex; align-items: center; gap: 12px; }
      .brand img { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--border); background: rgba(255,255,255,.06); }
      .brand h1 { font-size: 16px; margin: 0; letter-spacing: .2px; }
      .muted { color: var(--muted); }
      .pill {
        display: inline-flex; align-items: center; gap: 8px;
        padding: 6px 10px; border-radius: 999px;
        border: 1px solid var(--border);
        background: rgba(255,255,255,.03);
        font-size: 12px;
      }
      .btn {
        appearance: none;
        border: 1px solid var(--border);
        background: rgba(255,255,255,.06);
        color: var(--text);
        border-radius: 12px;
        padding: 10px 12px;
        cursor: pointer;
        transition: transform .05s ease, background .15s ease, border-color .15s ease;
        font-weight: 600;
      }
      .btn:hover { background: rgba(255,255,255,.10); border-color: rgba(255,255,255,.14); }
      .btn:active { transform: translateY(1px); }
      .btn.primary { background: rgba(182,80,246,.20); border-color: rgba(182,80,246,.45); }
      .btn.primary:hover { background: rgba(182,80,246,.28); }
      .btn.danger { background: rgba(255,92,92,.14); border-color: rgba(255,92,92,.35); }
      .btn:disabled { opacity: .55; cursor: not-allowed; }
      .input, .select {
        width: 100%;
        box-sizing: border-box;
        border: 1px solid var(--border);
        background: rgba(255,255,255,.03);
        color: var(--text);
        border-radius: 12px;
        padding: 10px 12px;
        outline: none;
      }
      .input:focus, .select:focus { border-color: rgba(182,80,246,.55); box-shadow: 0 0 0 3px rgba(182,80,246,.12); }
      .kpi { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      .kpi .item { border: 1px solid var(--border); border-radius: 14px; padding: 12px; background: rgba(255,255,255,.02); }
      .kpi .label { font-size: 12px; color: var(--muted); }
      .kpi .value { font-size: 16px; font-weight: 800; margin-top: 6px; }
      .status { font-size: 12px; }
      .good { color: var(--good); }
      .warn { color: var(--warn); }
      .bad { color: var(--bad); }
      .hr { height: 1px; background: var(--border); margin: 14px 0; }
      .actions { display: grid; gap: 10px; }
      .two { display: grid; grid-template-columns: 1fr; gap: 10px; }
      @media (min-width: 560px) { .two { grid-template-columns: 1fr 1fr; } }
      .small { font-size: 12px; }
      code.inline { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; font-size: 12px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
